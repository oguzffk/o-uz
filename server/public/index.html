<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İstanbul Yol Yönetimi</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --red: #d70015; --blue: #0a66d8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    body { display: grid; grid-template-columns: 340px 1fr; }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0 0 8px; }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .modes { display: flex; gap: 6px; margin-top: 10px; }
    .modes button { flex: 1; padding: 7px; border: 1px solid var(--line); background: #f5f5f7; border-radius: 6px; font: inherit; cursor: pointer; }
    .modes button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
    #status { padding: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); min-height: 33px; }
    #status.err { color: var(--red); }
    .panel { overflow: auto; flex: 1; min-height: 0; }
    .openall { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
    .openall button { flex: 1; border: 1px solid #0b8a3e; color: #0b8a3e; background: #fff; border-radius: 6px; padding: 7px; font: inherit; font-weight: 600; cursor: pointer; }
    .openall button.confirm { background: #0b8a3e; color: #fff; }
    .openall button:disabled { opacity: 0.4; cursor: default; }
    section { border-bottom: 1px solid var(--line); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; padding: 12px 16px 6px; }
    .save { display: flex; gap: 6px; padding: 4px 16px 12px; }
    .save button, .zone-actions button { border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; white-space: nowrap; }
    .save button:disabled { opacity: 0.45; cursor: default; }
    .zone-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .zone-actions button.open { background: #0b8a3e; }
    .zone-actions button.close { background: var(--red); }
    .zone-actions button.ghost { background: #f5f5f7; color: var(--fg); border: 1px solid var(--line); }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-right: 6px; }
    .badge.closed { background: #fde7e9; color: var(--red); }
    .badge.open { background: #e3f5ea; color: #0b8a3e; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; cursor: pointer; }
    li:hover { background: #f5f5f7; }
    li .meta { flex: 1; min-width: 0; }
    li .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .sub { color: var(--muted); font-size: 12px; }
    li button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
    .empty { padding: 16px; color: var(--muted); }
    #map { height: 100%; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 45vh; } aside { max-height: 55vh; } }
  </style>
</head>
<body>
  <aside>
    <header>
      <h1>İstanbul Yol Yönetimi</h1>
      <label for="token">Yönetici anahtarı</label>
      <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
      <div class="modes">
        <button id="mode-close" class="on">Yol kapat / aç</button>
        <button id="mode-route">Rota dene</button>
      </div>
    </header>
    <div id="status">Haritada bir sokağa tıklayın.</div>
    <div class="openall" id="openall-box">
      <button id="openall-btn" type="button">Tüm yolları trafiğe aç</button>
    </div>
    <div class="panel">
      <section>
        <h2>Kayıtlı gruplar</h2>
        <form class="save" id="save-form">
          <input id="zone-name" placeholder="Ör. Maraton güzergâhı" maxlength="80" autocomplete="off" />
          <button id="save-btn" type="submit" disabled>Kaydet</button>
        </form>
        <ul id="zones"></ul>
      </section>
      <section>
        <h2>Kaydedilmemiş kapatmalar</h2>
        <ul id="list"></ul>
      </section>
    </div>
  </aside>
  <div id="map"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>
    const api = (path, opts = {}) =>
      fetch(path, {
        ...opts,
        headers: { 'content-type': 'application/json', 'x-admin-token': tokenInput.value.trim(), ...(opts.headers || {}) },
      }).then(async (r) => {
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.error || r.statusText);
        return body;
      });

    const tokenInput = document.getElementById('token');
    try { tokenInput.value = localStorage.getItem('adminToken') || ''; } catch {}
    tokenInput.addEventListener('change', () => { try { localStorage.setItem('adminToken', tokenInput.value.trim()); } catch {} });

    const statusEl = document.getElementById('status');
    const setStatus = (msg, isErr = false) => { statusEl.textContent = msg; statusEl.className = isErr ? 'err' : ''; };

    const map = L.map('map').setView([41.0082, 28.9784], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap katkıcıları',
    }).addTo(map);

    const closureLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);
    const lines = new Map();

    const zoneLines = new Map();

    async function loadClosures() {
      const { closures, zones } = await api('/api/closures');
      closureLayer.clearLayers();
      lines.clear();
      zoneLines.clear();
      // Trafiğe açık gruplar haritada kesik çizgiyle gösterilir.
      for (const z of zones) {
        const group = L.featureGroup().addTo(closureLayer);
        if (!z.active) {
          for (const s of z.segments) {
            L.polyline(s.coordinates, { color: '#d70015', weight: 4, opacity: 0.6, dashArray: '4 8', interactive: false }).addTo(group);
          }
        }
        zoneLines.set(z.id, group);
      }
      for (const c of closures) {
        const line = L.polyline(c.coordinates, { color: '#d70015', weight: 7, opacity: 0.85 })
          .bindTooltip(c.zoneName ? `${c.name} — "${c.zoneName}" grubuyla kapalı` : `${c.name} — kapalı`)
          .addTo(c.zoneId ? zoneLines.get(c.zoneId) : closureLayer);
        // Kaydedilmemiş kapalı çizgiye tıklamak yolu açar; gruptakiler listeden yönetilir.
        line.on('click', (e) => {
          if (mode !== 'close') return;
          L.DomEvent.stopPropagation(e);
          if (c.zoneId) setStatus(`Bu yol "${c.zoneName}" grubuna ait. Grubu listeden trafiğe açın.`, true);
          else reopen(c.id);
        });
        lines.set(c.id, line);
      }
      renderZones(zones);
      renderList(closures.filter((c) => !c.zoneId));
      closedTotal = closures.length;
      renderOpenAll();
    }

    // "Tüm yolları trafiğe aç": önce onay ister; gruplar silinmez, yalnızca açılır.
    let closedTotal = 0;
    let confirmOpenAll = false;
    function renderOpenAll() {
      const box = document.getElementById('openall-box');
      box.innerHTML = '';
      const btn = (text, cls, fn, disabled = false) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text;
        if (cls) b.className = cls;
        b.disabled = disabled;
        b.addEventListener('click', fn);
        box.appendChild(b);
      };
      if (confirmOpenAll && closedTotal) {
        btn('Vazgeç', '', () => { confirmOpenAll = false; renderOpenAll(); });
        btn(`Evet, ${closedTotal} parçayı aç`, 'confirm', openAll);
      } else {
        btn(closedTotal ? `Tüm yolları trafiğe aç (${closedTotal})` : 'Kapalı yol yok', '', () => { confirmOpenAll = true; renderOpenAll(); }, !closedTotal);
      }
    }

    async function openAll() {
      confirmOpenAll = false;
      try {
        const r = await api('/api/closures/open-all', { method: 'POST' });
        setStatus(`Tüm yollar trafiğe açıldı (${r.removed} tekil kapatma kaldırıldı, ${r.zonesOpened} grup açıldı).`);
      } catch (err) { setStatus(err.message, true); renderOpenAll(); }
    }

    let confirmDelete = null;
    function renderZones(zones) {
      const list = document.getElementById('zones');
      list.innerHTML = '';
      if (!zones.length) {
        list.innerHTML = '<div class="empty">Henüz kayıtlı grup yok. Haritada yolları kapatın, bir isim yazıp kaydedin.</div>';
        return;
      }
      for (const z of zones) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="meta"><div class="name"></div><div class="sub"></div></div><div class="zone-actions"></div>`;
        li.querySelector('.name').textContent = z.name;
        const badge = document.createElement('span');
        badge.className = `badge ${z.active ? 'closed' : 'open'}`;
        badge.textContent = z.active ? 'Kapalı' : 'Açık';
        const meters = z.segments.reduce((sum, s) => sum + s.lengthMeters, 0);
        li.querySelector('.sub').textContent = `${z.segments.length} yol parçası · ${(meters / 1000).toFixed(1).replace('.', ',')} km`;
        li.querySelector('.sub').prepend(badge);
        const actions = li.querySelector('.zone-actions');
        const button = (text, cls, fn) => {
          const b = document.createElement('button');
          b.textContent = text;
          b.className = cls;
          b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
          actions.appendChild(b);
        };
        if (confirmDelete === z.id) {
          button('Vazgeç', 'ghost', () => { confirmDelete = null; renderZones(zones); });
          button('Evet, sil', 'close', () => deleteZone(z));
        } else {
          button(z.active ? 'Trafiğe aç' : 'Trafiğe kapat', z.active ? 'open' : 'close', () => setZone(z, !z.active));
          button('Sil', 'ghost', () => { confirmDelete = z.id; renderZones(zones); });
        }
        li.addEventListener('click', () => {
          const bounds = L.latLngBounds(z.segments.flatMap((s) => s.coordinates));
          map.fitBounds(bounds, { maxZoom: 17, padding: [30, 30] });
        });
        list.appendChild(li);
      }
    }

    async function setZone(z, active) {
      try {
        await api(`/api/zones/${z.id}`, { method: 'PATCH', body: JSON.stringify({ active }) });
        setStatus(`"${z.name}" ${active ? 'trafiğe kapatıldı' : 'trafiğe açıldı'}. Tüm kullanıcıların rotaları güncellenir.`);
      } catch (err) { setStatus(err.message, true); }
    }

    async function deleteZone(z) {
      confirmDelete = null;
      try {
        await api(`/api/zones/${z.id}`, { method: 'DELETE' });
        setStatus(`"${z.name}" grubu silindi.`);
      } catch (err) { setStatus(err.message, true); }
    }

    const zoneName = document.getElementById('zone-name');
    const saveBtn = document.getElementById('save-btn');
    let unsavedCount = 0;
    const updateSaveBtn = () => { saveBtn.disabled = !zoneName.value.trim() || unsavedCount === 0; };
    zoneName.addEventListener('input', updateSaveBtn);
    document.getElementById('save-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const r = await api('/api/zones', { method: 'POST', body: JSON.stringify({ name: zoneName.value.trim() }) });
        zoneName.value = '';
        updateSaveBtn();
        setStatus(`"${r.zone.name}" kaydedildi (${r.zone.segments.length} yol parçası, şu an trafiğe kapalı).`);
      } catch (err) { setStatus(err.message, true); }
    });

    function renderList(closures) {
      unsavedCount = closures.length;
      updateSaveBtn();
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (!closures.length) {
        list.innerHTML = '<div class="empty">Yok. Haritada bir sokağa tıklayarak kapatın.</div>';
        return;
      }
      for (const c of [...closures].reverse()) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="meta"><div class="name"></div><div class="sub"></div></div><button>Aç</button>`;
        li.querySelector('.name').textContent = c.name;
        li.querySelector('.sub').textContent = `${c.lengthMeters} m · ${new Date(c.createdAt).toLocaleString('tr-TR')}`;
        li.addEventListener('click', () => map.fitBounds(lines.get(c.id).getBounds(), { maxZoom: 18 }));
        li.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); reopen(c.id); });
        list.appendChild(li);
      }
    }

    async function reopen(id) {
      try {
        const r = await api(`/api/closures/${id}`, { method: 'DELETE' });
        setStatus(`Açıldı: ${r.closure.name}`);
      } catch (err) { setStatus(err.message, true); }
    }

    let mode = 'close';
    let routePoints = [];
    const modeBtns = { close: document.getElementById('mode-close'), route: document.getElementById('mode-route') };
    for (const [m, btn] of Object.entries(modeBtns)) {
      btn.addEventListener('click', () => {
        mode = m;
        for (const b of Object.values(modeBtns)) b.classList.toggle('on', b === btn);
        routePoints = [];
        routeLayer.clearLayers();
        setStatus(m === 'close' ? 'Haritada bir sokağa tıklayın.' : 'Başlangıç noktasına tıklayın.');
      });
    }

    async function drawRoute() {
      const [from, to] = routePoints;
      try {
        const r = await api('/api/route', { method: 'POST', body: JSON.stringify({ from, to }) });
        routeLayer.eachLayer((l) => { if (l instanceof L.Polyline) routeLayer.removeLayer(l); });
        L.polyline(r.coordinates, { color: '#0a66d8', weight: 6, opacity: 0.8 }).addTo(routeLayer);
        setStatus(`Rota: ${r.distanceKm.toFixed(2)} km · ${Math.round(r.durationSec / 60)} dk — yeni rota için tekrar tıklayın.`);
      } catch (err) { setStatus(err.message, true); }
    }

    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;
      if (mode === 'route') {
        if (routePoints.length === 2) { routePoints = []; routeLayer.clearLayers(); }
        routePoints.push({ lat, lon: lng });
        L.circleMarker(e.latlng, { radius: 7, color: '#0a66d8', fillOpacity: 1 }).addTo(routeLayer);
        if (routePoints.length === 1) setStatus('Varış noktasına tıklayın.');
        else drawRoute();
        return;
      }
      if (!tokenInput.value.trim()) return setStatus('Önce yönetici anahtarını girin.', true);
      setStatus('Yol aranıyor…');
      try {
        const r = await api('/api/closures/toggle', { method: 'POST', body: JSON.stringify({ lat, lon: lng }) });
        setStatus(`${r.action === 'closed' ? 'Kapatıldı' : 'Açıldı'}: ${r.closure.name} (${r.closure.lengthMeters} m)`);
      } catch (err) { setStatus(err.message, true); }
    });

    // Başka yöneticilerin değişiklikleri de anında görünsün; açık rota testi yenilensin.
    const events = new EventSource('/api/closures/stream');
    events.onmessage = () => {
      loadClosures().catch((err) => setStatus(err.message, true));
      if (mode === 'route' && routePoints.length === 2) drawRoute();
    };
  </script>
</body>
</html>
