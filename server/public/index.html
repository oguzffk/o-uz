<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HERMAP Yönetim</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --red: #d70015; --blue: #0a66d8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    body { display: grid; grid-template-columns: 340px 1fr; }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0 0 8px; }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .modes { display: flex; gap: 6px; margin-top: 10px; }
    .modes button { flex: 1; padding: 7px; border: 1px solid var(--line); background: #f5f5f7; border-radius: 6px; font: inherit; cursor: pointer; }
    .modes button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
    #status { padding: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); min-height: 33px; }
    #status.err { color: var(--red); }
    .panel { overflow: auto; flex: 1; min-height: 0; }
    .openall { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
    .openall button { flex: 1; border: 1px solid #0b8a3e; color: #0b8a3e; background: #fff; border-radius: 6px; padding: 7px; font: inherit; font-weight: 600; cursor: pointer; }
    .openall button.confirm { background: #0b8a3e; color: #fff; }
    .openall button:disabled { opacity: 0.4; cursor: default; }
    section { border-bottom: 1px solid var(--line); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; padding: 12px 16px 6px; }
    .save { display: flex; gap: 6px; padding: 4px 16px 12px; }
    .save button, .zone-actions button { border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; white-space: nowrap; }
    .save button:disabled { opacity: 0.45; cursor: default; }
    .zone-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .zone-actions button.open { background: #0b8a3e; }
    .zone-actions button.close { background: var(--red); }
    .zone-actions button.ghost { background: #f5f5f7; color: var(--fg); border: 1px solid var(--line); }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-right: 6px; }
    .badge.closed { background: #fde7e9; color: var(--red); }
    .badge.open { background: #e3f5ea; color: #0b8a3e; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; cursor: pointer; }
    li:hover { background: #f5f5f7; }
    li .meta { flex: 1; min-width: 0; }
    li .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .sub { color: var(--muted); font-size: 12px; }
    li button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
    .empty { padding: 16px; color: var(--muted); }
    #map { height: 100%; }
    .who { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .who .role { background: #eef4fd; color: var(--blue); border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 11px; }
    .who button, .linkbtn { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
    .tabs { display: flex; gap: 4px; background: #f2f2f7; border-radius: 8px; padding: 3px; margin-bottom: 4px; }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 6px 4px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; color: #3a3a3c; }
    .tabs button.on { background: #fff; font-weight: 700; color: #000; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    /* Giriş ekranı */
    #login { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center;
      background: linear-gradient(rgba(10,14,22,.55), rgba(10,14,22,.55)), repeating-linear-gradient(0deg, #ebe7df 0 59px, #fff 59px 70px), #ebe7df; }
    #login.show { display: flex; }
    #login .box { width: 360px; max-width: calc(100% - 32px); }
    #login .card { background: #fff; border-radius: 18px; padding: 22px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    #login h2 { all: unset; display: block; font-size: 20px; font-weight: 800; }
    #login p { color: var(--muted); margin: 4px 0 14px; font-size: 13px; }
    #login input { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; font-size: 15px; }
    #login .primary { width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 11px; font: inherit; font-weight: 700; cursor: pointer; }
    #login .err { color: var(--red); font-weight: 600; margin-bottom: 8px; min-height: 1em; }
    .wordmark { display: flex; justify-content: center; margin-bottom: 26px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
    .wm { display: flex; align-items: flex-end; color: #fff; font-size: 50px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
    .wm svg { margin: 0 1px 7px 0; }
    /* Üye / yönetici yönetimi (yalnızca sahip) */
    #manage { display: none; height: 100%; overflow: auto; padding: 18px 22px; background: #fff; }
    #manage.show { display: block; }
    #manage h3 { margin: 0 0 12px; font-size: 18px; }
    .mtools { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .mtools input { max-width: 320px; }
    .btn { border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; white-space: nowrap; }
    .btn.ghost { background: #f5f5f7; color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
    .btn.danger { background: #fff5f6; color: #b0000f; border: 1px solid #f3c4c9; }
    .btn.armed { background: var(--red); color: #fff; }
    .btn.days { background: #f4f8fe; color: var(--blue); border: 1px solid #c7d8f3; }
    table.users { width: 100%; border-collapse: collapse; }
    table.users th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 6px; border-bottom: 1px solid var(--line); }
    table.users td { padding: 8px 6px; border-bottom: 1px solid #f0f0f3; white-space: nowrap; }
    table.users td.acts { display: flex; gap: 5px; flex-wrap: wrap; white-space: normal; }
    .pill { border-radius: 999px; padding: 2px 9px; font-weight: 700; font-size: 12px; }
    .pill.ok { background: #e3f5e8; color: #1f7a3a; } .pill.warn { background: #fff1d6; color: #8a5a00; }
    .pill.bad { background: #fde7e9; color: #b0000f; } .pill.none { background: #eef0f3; color: #6e6e73; }
    .issued { background: #f2f7ff; border: 1px solid #c7d8f3; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; max-width: 520px; }
    .issued b.pw { font-size: 22px; letter-spacing: 3px; }
    .addform { display: flex; gap: 8px; margin-bottom: 12px; max-width: 620px; }
    .payform { max-width: 520px; display: grid; gap: 8px; }
    .noentry { width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; box-sizing: border-box; cursor: pointer; }
    .noentry::after { content: ''; width: 10px; height: 3.5px; background: #fff; border-radius: 1px; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 45vh; } aside { max-height: 55vh; } }
  </style>
</head>
<body>
  <div id="login">
    <div class="box">
      <div class="wordmark">
        <div class="wm" aria-label="HERMAP">HERM<svg width="38" height="37" viewBox="0 0 42 46" aria-hidden="true"><polygon points="16,0 26,0 42,46 32,46 21,13 10,46 0,46" fill="#fff"/>
          <clipPath id="ab"><rect x="4" y="25" width="34" height="11" rx="1.5"/></clipPath><rect x="4" y="25" width="34" height="11" rx="1.5" fill="#fff"/>
          <g clip-path="url(#ab)"><polygon points="-2,36 3,36 9,25 4,25" fill="#d70015"/><polygon points="7,36 12,36 18,25 13,25" fill="#d70015"/><polygon points="16,36 21,36 27,25 22,25" fill="#d70015"/><polygon points="25,36 30,36 36,25 31,25" fill="#d70015"/><polygon points="34,36 39,36 45,25 40,25" fill="#d70015"/></g></svg>P</div>
      </div>
      <form class="card" id="login-form">
        <h2 id="login-title">Yönetim paneli</h2>
        <p id="login-sub">Sahip ve yöneticiler telefon numarası ve şifreyle girer.</p>
        <div id="login-fields">
          <label>Telefon</label><input id="l-phone" autocomplete="username" placeholder="0532 123 45 67" />
          <label>Şifre</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••" />
        </div>
        <div id="pw-fields" style="display:none">
          <label>Yeni şifre</label><input id="l-new1" type="password" autocomplete="new-password" />
          <label>Yeni şifre (tekrar)</label><input id="l-new2" type="password" autocomplete="new-password" />
        </div>
        <div class="err" id="login-err"></div>
        <button class="primary" type="submit" id="login-btn">Giriş yap</button>
      </form>
    </div>
  </div>
  <aside>
    <header>
      <div class="who"><b id="who-name"></b><span class="role" id="who-role"></span><button id="logout" type="button">Çıkış</button></div>
      <div class="tabs" id="tabs" style="display:none">
        <button data-tab="roads" class="on">Yollar</button>
        <button data-tab="member">Üyeler</button>
        <button data-tab="admin">Yöneticiler</button>
        <button data-tab="payment">Ödeme</button>
      </div>
      <div class="modes">
        <button id="mode-close" class="on">Yol kapat / aç</button>
        <button id="mode-route">Rota dene</button>
      </div>
    </header>
    <div id="status">Haritada bir sokağa tıklayın.</div>
    <div class="openall" id="openall-box">
      <button id="openall-btn" type="button">Tüm yolları trafiğe aç</button>
    </div>
    <div class="panel">
      <section>
        <h2>Kayıtlı gruplar</h2>
        <form class="save" id="save-form">
          <input id="zone-name" placeholder="Ör. Maraton güzergâhı" maxlength="80" autocomplete="off" />
          <button id="save-btn" type="submit" disabled>Kaydet</button>
        </form>
        <ul id="zones"></ul>
      </section>
      <section>
        <h2>Kaydedilmemiş kapatmalar</h2>
        <ul id="list"></ul>
      </section>
    </div>
  </aside>
  <div style="position:relative;min-height:0"><div id="map"></div><div id="manage" style="position:absolute;inset:0;z-index:1000"></div></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script>
    // --- Oturum ---
    // Oturum anahtarı tarayıcıda saklanır; 401 gelirse giriş ekranı açılır.
    let token = null;
    let me = null;
    try { token = localStorage.getItem('hermapToken'); } catch {}
    const api = (path, opts = {}) =>
      fetch(path, {
        ...opts,
        headers: { 'content-type': 'application/json', ...(token ? { authorization: `Bearer ${token}` } : {}), ...(opts.headers || {}) },
      }).then(async (r) => {
        const body = await r.json().catch(() => ({}));
        if (r.status === 401 && path !== '/api/auth/login') { showLogin('Oturumunuz kapandı. Tekrar giriş yapın.'); }
        if (!r.ok) throw new Error(body.error || r.statusText);
        return body;
      });

    const statusEl = document.getElementById('status');
    const setStatus = (msg, isErr = false) => { statusEl.textContent = msg; statusEl.className = isErr ? 'err' : ''; };

    const map = L.map('map').setView([41.0082, 28.9784], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap katkıcıları',
    }).addTo(map);

    const closureLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);
    const lines = new Map();

    const zoneLines = new Map();

    async function loadClosures() {
      const { closures, zones } = await api('/api/closures');
      closureLayer.clearLayers();
      lines.clear();
      zoneLines.clear();
      // Trafiğe açık gruplar haritada kesik çizgiyle gösterilir.
      for (const z of zones) {
        const group = L.featureGroup().addTo(closureLayer);
        if (!z.active) {
          for (const s of z.segments) {
            L.polyline(s.coordinates, { color: '#8e8e93', weight: 4, opacity: 0.8, dashArray: '4 8', interactive: false }).addTo(group);
          }
        }
        zoneLines.set(z.id, group);
      }
      for (const c of closures) {
        // Kapalı yol: beyaz zemin + kırmızı kesik çizgi (kırmızı-beyaz şerit) ve ortada girilmez levhası.
        const target = c.zoneId ? zoneLines.get(c.zoneId) : closureLayer;
        L.polyline(c.coordinates, { color: '#fff', weight: 8, opacity: 1, interactive: false }).addTo(target);
        const tip = c.zoneName ? `${c.name} — "${c.zoneName}" grubuyla kapalı` : `${c.name} — kapalı`;
        const line = L.polyline(c.coordinates, { color: '#d70015', weight: 8, opacity: 1, dashArray: '10 8', lineCap: 'butt' })
          .bindTooltip(tip)
          .addTo(target);
        const mid = c.midpoint ?? c.coordinates[Math.floor(c.coordinates.length / 2)];
        const sign = L.marker(mid, { icon: L.divIcon({ className: '', html: '<div class="noentry"></div>', iconSize: [22, 22] }) })
          .bindTooltip(tip)
          .addTo(target);
        // Kaydedilmemiş kapalı çizgiye tıklamak yolu açar; gruptakiler listeden yönetilir.
        const onClosedClick = (e) => {
          if (mode !== 'close' || editingZoneId) return; // düzenlemede tıklama haritaya geçsin
          L.DomEvent.stopPropagation(e);
          if (c.zoneId) setStatus(`Bu yol "${c.zoneName}" grubuna ait. Grubu listeden trafiğe açın.`, true);
          else reopen(c.id);
        };
        line.on('click', onClosedClick);
        sign.on('click', onClosedClick);
        lines.set(c.id, line);
      }
      renderZones(zones);
      renderList(closures.filter((c) => !c.zoneId));
      closedTotal = closures.length;
      renderOpenAll();
    }

    // "Tüm yolları trafiğe aç": önce onay ister; gruplar silinmez, yalnızca açılır.
    let closedTotal = 0;
    let confirmOpenAll = false;
    function renderOpenAll() {
      const box = document.getElementById('openall-box');
      box.innerHTML = '';
      const btn = (text, cls, fn, disabled = false) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text;
        if (cls) b.className = cls;
        b.disabled = disabled;
        b.addEventListener('click', fn);
        box.appendChild(b);
      };
      if (confirmOpenAll && closedTotal) {
        btn('Vazgeç', '', () => { confirmOpenAll = false; renderOpenAll(); });
        btn(`Evet, ${closedTotal} parçayı aç`, 'confirm', openAll);
      } else {
        btn(closedTotal ? `Tüm yolları trafiğe aç (${closedTotal})` : 'Kapalı yol yok', '', () => { confirmOpenAll = true; renderOpenAll(); }, !closedTotal);
      }
    }

    async function openAll() {
      confirmOpenAll = false;
      try {
        const r = await api('/api/closures/open-all', { method: 'POST' });
        setStatus(`Tüm yollar trafiğe açıldı (${r.removed} tekil kapatma kaldırıldı, ${r.zonesOpened} grup açıldı).`);
      } catch (err) { setStatus(err.message, true); renderOpenAll(); }
    }

    let confirmDelete = null;
    function renderZones(zones) {
      lastZones = zones;
      if (editingZoneId && !zones.some((z) => z.id === editingZoneId)) editingZoneId = null;
      drawEditing();
      const list = document.getElementById('zones');
      list.innerHTML = '';
      if (!zones.length) {
        list.innerHTML = '<div class="empty">Henüz kayıtlı grup yok. Haritada yolları kapatın, bir isim yazıp kaydedin.</div>';
        return;
      }
      for (const z of zones) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="meta"><div class="name"></div><div class="sub"></div></div><div class="zone-actions"></div>`;
        li.querySelector('.name').textContent = z.name;
        const badge = document.createElement('span');
        badge.className = `badge ${z.active ? 'closed' : 'open'}`;
        badge.textContent = z.active ? 'Kapalı' : 'Açık';
        const meters = z.segments.reduce((sum, s) => sum + s.lengthMeters, 0);
        li.querySelector('.sub').textContent = `${z.segments.length} yol parçası · ${(meters / 1000).toFixed(1).replace('.', ',')} km`;
        li.querySelector('.sub').prepend(badge);
        const actions = li.querySelector('.zone-actions');
        const button = (text, cls, fn) => {
          const b = document.createElement('button');
          b.textContent = text;
          b.className = cls;
          b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
          actions.appendChild(b);
        };
        if (confirmDelete === z.id) {
          button('Vazgeç', 'ghost', () => { confirmDelete = null; renderZones(zones); });
          button('Evet, sil', 'close', () => deleteZone(z));
        } else {
          button(z.active ? 'Trafiğe aç' : 'Trafiğe kapat', z.active ? 'open' : 'close', () => setZone(z, !z.active));
          button(editingZoneId === z.id ? 'Bitti' : 'Düzenle', 'ghost', () => toggleEditing(z));
          button('Sil', 'ghost', () => { confirmDelete = z.id; renderZones(zones); });
        }
        li.addEventListener('click', () => {
          const bounds = L.latLngBounds(z.segments.flatMap((s) => s.coordinates));
          map.fitBounds(bounds, { maxZoom: 17, padding: [30, 30] });
        });
        list.appendChild(li);
      }
    }

    // Grup düzenleme: açıkken haritaya tıklamak yolu gruba ekler / gruptan çıkarır.
    let editingZoneId = null;
    let lastZones = [];
    function toggleEditing(z) {
      editingZoneId = editingZoneId === z.id ? null : z.id;
      if (editingZoneId) {
        setStatus(`"${z.name}" düzenleniyor: yola tıklayın = gruba ekle, gruptaki yola tıklayın = çıkar. Bitirmek için "Bitti".`);
      } else {
        setStatus('Düzenleme bitti.');
      }
      renderZones(lastZones);
      drawEditing();
    }
    const editLayer = L.layerGroup().addTo(map);
    function drawEditing() {
      editLayer.clearLayers();
      const z = lastZones.find((x) => x.id === editingZoneId);
      if (!z) return;
      for (const seg of z.segments) {
        L.polyline(seg.coordinates, { color: '#f08c00', weight: 8, opacity: 0.9, interactive: false }).addTo(editLayer);
      }
    }

    async function setZone(z, active) {
      try {
        await api(`/api/zones/${z.id}`, { method: 'PATCH', body: JSON.stringify({ active }) });
        setStatus(`"${z.name}" ${active ? 'trafiğe kapatıldı' : 'trafiğe açıldı'}. Tüm kullanıcıların rotaları güncellenir.`);
      } catch (err) { setStatus(err.message, true); }
    }

    async function deleteZone(z) {
      confirmDelete = null;
      try {
        await api(`/api/zones/${z.id}`, { method: 'DELETE' });
        setStatus(`"${z.name}" grubu silindi.`);
      } catch (err) { setStatus(err.message, true); }
    }

    const zoneName = document.getElementById('zone-name');
    const saveBtn = document.getElementById('save-btn');
    let unsavedCount = 0;
    const updateSaveBtn = () => { saveBtn.disabled = !zoneName.value.trim() || unsavedCount === 0; };
    zoneName.addEventListener('input', updateSaveBtn);
    document.getElementById('save-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const r = await api('/api/zones', { method: 'POST', body: JSON.stringify({ name: zoneName.value.trim() }) });
        zoneName.value = '';
        updateSaveBtn();
        setStatus(`"${r.zone.name}" kaydedildi (${r.zone.segments.length} yol parçası, şu an trafiğe kapalı).`);
      } catch (err) { setStatus(err.message, true); }
    });

    function renderList(closures) {
      unsavedCount = closures.length;
      updateSaveBtn();
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (!closures.length) {
        list.innerHTML = '<div class="empty">Yok. Haritada bir sokağa tıklayarak kapatın.</div>';
        return;
      }
      for (const c of [...closures].reverse()) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="meta"><div class="name"></div><div class="sub"></div></div><button>Aç</button>`;
        li.querySelector('.name').textContent = c.name;
        li.querySelector('.sub').textContent = `${c.lengthMeters} m · ${new Date(c.createdAt).toLocaleString('tr-TR')}`;
        li.addEventListener('click', () => map.fitBounds(lines.get(c.id).getBounds(), { maxZoom: 18 }));
        li.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); reopen(c.id); });
        list.appendChild(li);
      }
    }

    async function reopen(id) {
      try {
        const r = await api(`/api/closures/${id}`, { method: 'DELETE' });
        setStatus(`Açıldı: ${r.closure.name}`);
      } catch (err) { setStatus(err.message, true); }
    }

    let mode = 'close';
    let routePoints = [];
    const modeBtns = { close: document.getElementById('mode-close'), route: document.getElementById('mode-route') };
    for (const [m, btn] of Object.entries(modeBtns)) {
      btn.addEventListener('click', () => {
        mode = m;
        for (const b of Object.values(modeBtns)) b.classList.toggle('on', b === btn);
        routePoints = [];
        routeLayer.clearLayers();
        setStatus(m === 'close' ? 'Haritada bir sokağa tıklayın.' : 'Başlangıç noktasına tıklayın.');
      });
    }

    async function drawRoute() {
      const [from, to] = routePoints;
      try {
        const r = await api('/api/route', { method: 'POST', body: JSON.stringify({ from, to }) });
        routeLayer.eachLayer((l) => { if (l instanceof L.Polyline) routeLayer.removeLayer(l); });
        L.polyline(r.coordinates, { color: '#0a66d8', weight: 6, opacity: 0.8 }).addTo(routeLayer);
        setStatus(`Rota: ${r.distanceKm.toFixed(2)} km · ${Math.round(r.durationSec / 60)} dk — yeni rota için tekrar tıklayın.`);
      } catch (err) { setStatus(err.message, true); }
    }

    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;
      if (mode === 'route') {
        if (routePoints.length === 2) { routePoints = []; routeLayer.clearLayers(); }
        routePoints.push({ lat, lon: lng });
        L.circleMarker(e.latlng, { radius: 7, color: '#0a66d8', fillOpacity: 1 }).addTo(routeLayer);
        if (routePoints.length === 1) setStatus('Varış noktasına tıklayın.');
        else drawRoute();
        return;
      }
      if (editingZoneId) {
        try {
          const r = await api(`/api/zones/${editingZoneId}/toggle-segment`, { method: 'POST', body: JSON.stringify({ lat, lon: lng }) });
          setStatus(`${r.action === 'added' ? 'Gruba eklendi' : 'Gruptan çıkarıldı'}: ${r.segment.name} ("${r.zone.name}", ${r.zone.segments.length} parça)`);
        } catch (err) { setStatus(err.message, true); }
        return;
      }
      setStatus('Yol aranıyor…');
      try {
        const r = await api('/api/closures/toggle', { method: 'POST', body: JSON.stringify({ lat, lon: lng }) });
        setStatus(`${r.action === 'closed' ? 'Kapatıldı' : 'Açıldı'}: ${r.closure.name} (${r.closure.lengthMeters} m)`);
      } catch (err) { setStatus(err.message, true); }
    });

    // Başka yöneticilerin değişiklikleri de anında görünsün; açık rota testi yenilensin.
    let events = null;
    function connectStream() {
      events?.close();
      events = new EventSource(`/api/closures/stream?token=${encodeURIComponent(token)}`);
      events.onmessage = () => {
        loadClosures().catch((err) => setStatus(err.message, true));
        if (mode === 'route' && routePoints.length === 2) drawRoute();
      };
    }

    // --- Giriş ---
    const loginEl = document.getElementById('login');
    const loginErr = document.getElementById('login-err');
    let changingPassword = false;
    function showLogin(message = '') {
      events?.close();
      token = null;
      me = null;
      try { localStorage.removeItem('hermapToken'); } catch {}
      setPasswordMode(false);
      loginErr.textContent = message;
      loginEl.classList.add('show');
    }
    function setPasswordMode(on) {
      changingPassword = on;
      document.getElementById('login-fields').style.display = on ? 'none' : '';
      document.getElementById('pw-fields').style.display = on ? '' : 'none';
      document.getElementById('login-title').textContent = on ? 'Kendi şifrenizi belirleyin' : 'Yönetim paneli';
      document.getElementById('login-sub').textContent = on
        ? 'Geçici şifre yalnızca ilk giriş içindi. En az 6 karakterli yeni bir şifre seçin.'
        : 'Sahip ve yöneticiler telefon numarası ve şifreyle girer.';
      document.getElementById('login-btn').textContent = on ? 'Kaydet ve devam et' : 'Giriş yap';
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErr.textContent = '';
      try {
        if (changingPassword) {
          const p1 = document.getElementById('l-new1').value;
          if (p1 !== document.getElementById('l-new2').value) throw new Error('İki şifre aynı değil.');
          const r = await api('/api/auth/password', { method: 'POST', body: JSON.stringify({ newPassword: p1 }) });
          return enter(r.user);
        }
        const r = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ phone: document.getElementById('l-phone').value, password: document.getElementById('l-pass').value }),
        });
        if (r.user.role === 'member') {
          token = r.token;
          await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
          token = null;
          throw new Error('Bu panel yalnızca sahip ve yöneticiler içindir. Üyeler mobil uygulamayı kullanır.');
        }
        token = r.token;
        try { localStorage.setItem('hermapToken', token); } catch {}
        if (r.user.mustChangePassword) return setPasswordMode(true);
        enter(r.user);
      } catch (err) {
        loginErr.textContent = err.message;
      }
    });
    document.getElementById('logout').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
      showLogin();
    });

    function enter(user) {
      me = user;
      loginEl.classList.remove('show');
      document.getElementById('who-name').textContent = user.name;
      document.getElementById('who-role').textContent = user.role === 'owner' ? 'Sahip' : 'Yönetici';
      // Üyeler, yöneticiler ve ödeme sekmeleri yalnızca sahipte.
      document.getElementById('tabs').style.display = user.role === 'owner' ? '' : 'none';
      showTab('roads');
      loadClosures().catch((err) => setStatus(err.message, true));
      connectStream();
    }

    (async () => {
      if (!token) return showLogin();
      try {
        const { user } = await api('/api/auth/me');
        if (user.role === 'member') return showLogin();
        if (user.mustChangePassword) {
          loginEl.classList.add('show');
          return setPasswordMode(true);
        }
        enter(user);
      } catch {
        showLogin();
      }
    })();

    // --- Üyeler / yöneticiler / ödeme (yalnızca sahip) ---
    const manage = document.getElementById('manage');
    let tab = 'roads';
    let issued = null; // { user, tempPassword, reset }
    let armed = null; // iki tıklamalı onay: "id:işlem"
    let query = '';
    let rows = [];
    document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
    function showTab(t) {
      tab = t;
      issued = null;
      armed = null;
      query = '';
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
      manage.classList.toggle('show', t !== 'roads');
      if (t === 'member' || t === 'admin') loadUsers();
      if (t === 'payment') renderPayment();
      if (t === 'roads') setTimeout(() => map.invalidateSize(), 0);
    }
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    const fmtPhone = (p) => p.replace(/^(\d{4})(\d{3})(\d{2})(\d{2})$/, '$1 $2 $3 $4');
    function remaining(u) {
      if (u.expiresAt == null) return ['Süre yok', 'none'];
      const ms = u.expiresAt - Date.now();
      if (ms <= 0) return ['Süresi doldu', 'bad'];
      const min = Math.floor(ms / 60000), d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60);
      return [d ? `${d} gün ${h} saat` : h ? `${h} saat ${min % 60} dk` : `${Math.max(1, min)} dk`, ms < 86400000 ? 'warn' : 'ok'];
    }
    async function loadUsers() {
      try {
        rows = (await api(`/api/users?role=${tab}`)).users;
      } catch (err) { setStatus(err.message, true); rows = []; }
      renderUsers();
    }
    async function userAct(fn, message) {
      armed = null;
      try {
        const r = await fn();
        if (message) setStatus(message);
        await loadUsers();
        return r;
      } catch (err) { setStatus(err.message, true); renderUsers(); return null; }
    }
    const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body ?? {}) });
    function renderUsers() {
      const isMember = tab === 'member';
      const q = query.trim().toLocaleLowerCase('tr');
      const list = rows.filter((u) => !q || u.name.toLocaleLowerCase('tr').includes(q) || (q.replace(/\D/g, '') && u.phone.includes(q.replace(/\D/g, ''))));
      const wa = issued && `https://wa.me/90${issued.user.phone.slice(1)}?text=${encodeURIComponent(`HERMAP ${issued.reset ? 'yeni geçici şifreniz' : 'hesabınız açıldı'}.\nTelefon: ${fmtPhone(issued.user.phone)}\nGeçici şifre: ${issued.tempPassword}\nİlk girişte kendi şifrenizi belirleyeceksiniz.`)}`;
      manage.innerHTML = `
        <h3>${isMember ? 'Üyeler' : 'Yöneticiler'} <span style="color:#8e8e93;font-weight:600;font-size:14px">(${rows.length})</span></h3>
        ${issued ? `<div class="issued"><b>${issued.reset ? 'Yeni geçici şifre' : (isMember ? 'Üye' : 'Yönetici') + ' eklendi ✓'}</b>
          <div style="color:#6e6e73;margin:2px 0 8px">${esc(issued.user.name)} · ${fmtPhone(issued.user.phone)}</div>
          Geçici şifre: <b class="pw">${issued.tempPassword}</b>
          <div style="display:flex;gap:8px;margin-top:10px"><a class="btn" style="background:#25d366;text-decoration:none" target="_blank" rel="noopener" href="${wa}">WhatsApp'a gönder</a>
          <button class="btn ghost" data-act="close-issued">Tamam</button></div></div>` : ''}
        <form class="addform" id="addform">
          <input id="a-name" placeholder="Ad soyad" maxlength="80" />
          <input id="a-phone" placeholder="Telefon (0532 123 45 67)" />
          <button class="btn" type="submit">＋ ${isMember ? 'Üye' : 'Yönetici'} ekle</button>
        </form>
        ${isMember ? '' : '<p style="color:#6e6e73;margin:0 0 10px">Yöneticiler yalnızca yol kapatıp açar ve gruplara erişir; üyeleri göremez, süre veremez.</p>'}
        <div class="mtools"><input id="q" placeholder="Ad veya telefon ara" value="${esc(query)}" /></div>
        <table class="users"><thead><tr><th>Ad soyad</th><th>Telefon</th>${isMember ? '<th>Kalan süre</th>' : ''}<th>Son giriş</th><th></th></tr></thead><tbody>
        ${list.map((u) => {
          const [rt, tone] = remaining(u);
          const confirmBtn = (act, label, danger) => `<button class="btn ${danger ? 'danger' : 'ghost'} ${armed === u.id + ':' + act ? 'armed' : ''}" data-act="${act}" data-id="${u.id}">${armed === u.id + ':' + act ? 'Emin misiniz?' : label}</button>`;
          return `<tr><td><b>${esc(u.name)}</b></td><td>${fmtPhone(u.phone)}</td>
            ${isMember ? `<td><span class="pill ${tone}">${rt}</span></td>` : ''}
            <td style="color:#6e6e73">${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('tr-TR') : '—'}</td>
            <td class="acts">${isMember ? `<button class="btn days" data-act="extend" data-days="1" data-id="${u.id}">+1 gün</button><button class="btn days" data-act="extend" data-days="3" data-id="${u.id}">+3 gün</button><button class="btn days" data-act="extend" data-days="7" data-id="${u.id}">+1 hafta</button>${tone === 'ok' || tone === 'warn' ? confirmBtn('expire', 'Süreyi bitir', true) : ''}` : ''}
            ${confirmBtn('reset', 'Şifre sıfırla')}${confirmBtn('delete', 'Sil', true)}</td></tr>`;
        }).join('') || `<tr><td colspan="5" style="color:#6e6e73">${query ? 'Eşleşen kişi yok.' : 'Henüz kimse yok.'}</td></tr>`}
        </tbody></table>`;
      const qInput = manage.querySelector('#q');
      qInput.addEventListener('input', () => { query = qInput.value; renderUsers(); manage.querySelector('#q').focus(); manage.querySelector('#q').setSelectionRange(query.length, query.length); });
      manage.querySelector('#addform').addEventListener('submit', async (e) => {
        e.preventDefault();
        const r = await userAct(() => post('/api/users', { name: manage.querySelector('#a-name').value, phone: manage.querySelector('#a-phone').value, role: tab }));
        if (r) { issued = r; renderUsers(); }
      });
    }
    manage.addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const { act, id } = b.dataset;
      const u = rows.find((x) => x.id === id);
      if (act === 'close-issued') { issued = null; return renderUsers(); }
      if (act === 'extend') return userAct(() => post(`/api/users/${id}/extend`, { days: Number(b.dataset.days) }), `${u.name}: süre eklendi.`);
      if (armed !== `${id}:${act}`) { armed = `${id}:${act}`; return renderUsers(); }
      if (act === 'expire') return userAct(() => post(`/api/users/${id}/expire`), `${u.name}: süre bitirildi.`);
      if (act === 'delete') return userAct(() => api(`/api/users/${id}`, { method: 'DELETE' }), `${u.name} silindi.`);
      if (act === 'reset') {
        const r = await userAct(() => post(`/api/users/${id}/reset-password`));
        if (r) { issued = { ...r, reset: true }; renderUsers(); }
      }
    });
    async function renderPayment() {
      let st = {};
      try { st = (await api('/api/settings')).settings; } catch (err) { setStatus(err.message, true); }
      manage.innerHTML = `<h3>Ödeme bilgisi</h3><p style="color:#6e6e73;margin-top:0">Süresi biten üyenin uygulamasında görünür.</p>
        <form class="payform" id="payform">
          <label>Alıcı adı<input name="accountName" value="${esc(st.accountName)}" /></label>
          <label>IBAN<input name="iban" value="${esc(st.iban)}" /></label>
          <label>WhatsApp numarası<input name="whatsapp" value="${esc(st.whatsapp)}" placeholder="0532 123 45 67" /></label>
          <div style="display:flex;gap:8px">
            <label style="flex:1">1 gün<input name="day1" value="${esc(st.prices?.day1)}" /></label>
            <label style="flex:1">3 gün<input name="day3" value="${esc(st.prices?.day3)}" /></label>
            <label style="flex:1">1 hafta<input name="week1" value="${esc(st.prices?.week1)}" /></label>
          </div>
          <button class="btn" type="submit" style="justify-self:start">Kaydet</button>
        </form>`;
      manage.querySelector('#payform').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        try {
          await api('/api/settings', { method: 'PUT', body: JSON.stringify({ accountName: f.get('accountName'), iban: f.get('iban'), whatsapp: f.get('whatsapp'), prices: { day1: f.get('day1'), day3: f.get('day3'), week1: f.get('week1') } }) });
          setStatus('Ödeme bilgisi kaydedildi.');
        } catch (err) { setStatus(err.message, true); }
      });
    }
  </script>
</body>
</html>
