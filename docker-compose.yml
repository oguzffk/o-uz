services:
  # Rota motoru. valhalla/custom_files/istanbul.osm.pbf'den ilk açılışta grafik kurar,
  # sonraki açılışlarda hazır grafiği kullanır.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    # Rota motoru dışarıya açılmaz: yalnızca bu bilgisayardan ve API'den erişilir
    # (kapalı yol kuralları ve giriş kontrolü atlanamasın).
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    environment:
      - serve_tiles=True
      - use_tiles_ignore_pbf=True   # grafik varsa PBF'i yeniden işleme
      - force_rebuild=False         # OSM verisini güncelleyince True yapıp bir kez çalıştırın
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - server_threads=2
    restart: unless-stopped

  # Mobil uygulamanın konuştuğu API + yönetici paneli (http://localhost:3000/admin/)
  api:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - VALHALLA_URL=http://valhalla:8002
      # İlk açılışta sahip hesabı (sonra panelden yönetilir). .env dosyasında tanımlayın.
      - OWNER_PHONE=${OWNER_PHONE:?OWNER_PHONE tanımlayın (ör. .env dosyasında)}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - OWNER_NAME=${OWNER_NAME:-Sahip}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      # Giriş kodu e-postaları (ayarlı değilse kodlar `docker compose logs api` çıktısına yazılır)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Adres arama: HERE anahtarı (siteler ve işletmeler için; yoksa OpenStreetMap araması)
      - HERE_API_KEY=${HERE_API_KEY:-}
      # Mağaza satın alımları: RevenueCat webhook'unun Authorization değeri
      - REVENUECAT_WEBHOOK_AUTH=${REVENUECAT_WEBHOOK_AUTH:-}
      - REVENUECAT_ALLOW_SANDBOX=${REVENUECAT_ALLOW_SANDBOX:-}
      - CLOSURES_FILE=/data/closures.json
      - USERS_FILE=/data/users.json
      - REPORTS_FILE=/data/reports.json
    volumes:
      - ./server/data:/data
    depends_on:
      - valhalla
    restart: unless-stopped
